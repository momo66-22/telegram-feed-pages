<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>Telegram Group Invite</title>
  <link rel="stylesheet" href="/joinchat/gate.css" />
</head>
<body>
<!-- Top bar -->
  <header class="topbar" role="banner">
    <a class="brand brand-link" id="brandLink" href="https://telegram.org" aria-label="Telegram" target="_blank" rel="noopener noreferrer">
      <div class="logo" aria-hidden="true">
        <!-- Simple paper-plane SVG -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M21.8 4.6c.3-1.1-.7-2-1.7-1.6L2.9 10.1c-1.2.5-1.1 2.2.1 2.6l4.8 1.7 1.8 5.3c.4 1.1 1.9 1.2 2.4.2l2.6-4.3 5.1 3.7c1 .7 2.4.1 2.7-1.1L21.8 4.6Z" fill="white" opacity="0.95"/>
          <path d="M8.1 14.4 18.9 6.6c.3-.2.6.2.4.4l-8.6 8.4c-.4.4-.6.9-.6 1.4v2.6c0 .4-.5.5-.6.1l-1.2-4.1c-.1-.5.1-1.1.8-1Z" fill="white" opacity="0.65"/>
        </svg>
      </div>
      <span>Telegram</span>
    </a>

    <button class="btn btn-download" id="downloadBtn" type="button">Download</button>
  </header>

  <main class="wrap">
    <div class="toast" id="toast" aria-live="polite"></div>

    <section class="card" aria-label="Group invite card">

      <div class="avatar" aria-label="Group image">
        <img src="https://cdn.telgra.me/share/TIKTOK-Free.jpg" alt="Group avatar">
      </div>

      <div class="title" id="groupName">TikTok Girls</div>
      <p class="subtitle">
        You are invited to a <b>group chat</b> on <b>Telegram</b>.
      </p>

      <button class="btn btn-join" id="joinBtn" type="button">Join Group</button>
      <a class="more" id="moreGroups" href="/" role="button">More Groups</a>
</section>
  </main>

  <!-- Modal -->
  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Invite Progress">
      <div class="progress-label">Invite Progress</div>
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-count" id="progressCount">0/3 invites</div>

          <div class="pending" id="pendingStatus" aria-live="polite"></div>

      <div class="modal-title" id="modalGroupName">TikTok Girls</div>

      <div class="cta-strong">Private Media 🔒 Complete task to unlock.</div>
      <div class="cta-sub">Invite 3 people to unlock access.</div>

      <button class="btn btn-share" id="shareBtn" type="button">Share</button>
      <div><a class="skip" id="skipShare" href="#">Skip Share</a></div>

      <div class="modal-footer">
        <button class="btn btn-ok" id="okBtn" type="button">OK</button>
      </div>
    </div>
  </div>

  <script src="/joinchat/gate.js"></script>
</body>
</html>
